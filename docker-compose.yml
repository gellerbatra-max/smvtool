services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smvtool}
    volumes:
      - smv_postgres_data:/var/lib/postgresql/data
    ports:
      # Host port overridable: default 5432 collides easily with another
      # project's Postgres already running on a shared dev machine.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SMV_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smv}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smvtool}
      SMV_JWT_SECRET: ${SMV_JWT_SECRET:?set SMV_JWT_SECRET in .env -- do not deploy on the dev default}
      SMV_BOOTSTRAP_ADMIN_USER: ${SMV_BOOTSTRAP_ADMIN_USER:-admin}
      SMV_BOOTSTRAP_ADMIN_PASSWORD: ${SMV_BOOTSTRAP_ADMIN_PASSWORD:?set SMV_BOOTSTRAP_ADMIN_PASSWORD in .env -- do not deploy on the dev default}
      SMV_CORS_ORIGINS: ${SMV_CORS_ORIGINS:-http://localhost:5173}
    ports:
      # Bound to 127.0.0.1 explicitly, not just "8000:8000" (which Docker
      # publishes on both 0.0.0.0 AND ::, the IPv6 wildcard). Colima's
      # userspace port forwarder (gvisor-tap-vsock) advertises the IPv6
      # binding but doesn't reliably forward it -- a browser resolving
      # "localhost" tries ::1 first (Happy Eyeballs), stalls on that dead
      # forward for several seconds, then falls back to IPv4 and works.
      # Binding to 127.0.0.1 only removes the IPv6 listener entirely so
      # there's nothing to stall on. (curl doesn't show this: it fails the
      # ::1 attempt fast enough that the IPv4 fallback looks instant.)
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl; urllib is stdlib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Opt-in: never runs on a plain `docker compose up`. Populates a
  # realistic demo dataset (backend/scripts/seed_demo/) across all six
  # tables via the same REST API a human would use -- see
  # backend/README.md's "Demo data" section.
  #
  #   docker compose --profile demo run --rm seed-demo [--reset-demo]
  #
  seed-demo:
    build: ./backend
    profiles: ["demo"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"
    entrypoint: ["python", "scripts/seed_demo_database.py"]
    command: ["--wait-for-backend", "120"]
    environment:
      SMV_SEED_BASE_URL: http://backend:8000
      SMV_SEED_USERNAME: ${SMV_BOOTSTRAP_ADMIN_USER:-admin}
      SMV_SEED_PASSWORD: ${SMV_BOOTSTRAP_ADMIN_PASSWORD:?set SMV_BOOTSTRAP_ADMIN_PASSWORD in .env -- do not deploy on the dev default}
      SMV_SEED_DEMO_PASSWORD: ${SMV_SEED_DEMO_PASSWORD:-demo-pass-2026}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  smv_postgres_data:
